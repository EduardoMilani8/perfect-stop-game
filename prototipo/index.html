<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parada Perfeita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: a pista em cena larga no topo, painel de instrumentos ao lado, gráficos das derivadas embaixo */
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --ink: #161b22;
    --muted: #5d6773;
    --line: #d6dbe1;
    --sky: #dde9f3;
    --ground: #c5d3b3;
    --road: #3a3f46;
    --paint: #f2c230;
    --signal: #d8262f;
    --accent: #1f5fd1;
    --ok: #128a51;
    --bad: #d8262f;
    --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #1a1e24; --ink: #e9edf1; --muted: #9aa4ae; --line: #2b3139;
      --sky: #1a2330; --ground: #26321f; --road: #4b515a; --paint: #f5c94a; --signal: #ff4b55;
      --accent: #7fa6ff; --ok: #3ccf8e; --bad: #ff5f68; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --panel: #1a1e24; --ink: #e9edf1; --muted: #9aa4ae; --line: #2b3139;
    --sky: #1a2330; --ground: #26321f; --road: #4b515a; --paint: #f5c94a; --signal: #ff4b55;
    --accent: #7fa6ff; --ok: #3ccf8e; --bad: #ff5f68; color-scheme: dark;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
  .app {
    max-width: 1280px; margin: 0 auto;
    padding-block: max(20px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 18px;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
  .marca { display: flex; align-items: center; gap: 14px; }
  .semaforo { width: 26px; height: 58px; border-radius: 7px; background: #161b22; display: flex; flex-direction: column; justify-content: space-around; align-items: center; padding: 4px 0; flex: none; }
  .semaforo i { width: 14px; height: 14px; border-radius: 50%; background: #3a3f46; }
  .semaforo i:first-child { background: #ff3b45; box-shadow: 0 0 8px #ff3b45; }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(2.1rem, 5vw, 3.1rem); line-height: .92; text-transform: uppercase; letter-spacing: .01em; }
  .sub { margin: 4px 0 0; color: var(--muted); }

  .fases { display: flex; flex-wrap: wrap; gap: 8px; }
  .fases button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 0;
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; text-align: left;
  }
  .fases b { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .fases small { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
  .fases button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .fases button[aria-pressed="true"] small { color: var(--paint); }

  .grade { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .grade { grid-template-columns: minmax(0, 1fr); } }

  .pista { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; min-height: 2.4em; }
  .missao { margin: 0; font-size: 1.05rem; }
  .missao strong { font-family: var(--font-display); font-size: 1.3rem; text-transform: uppercase; letter-spacing: .02em; margin-right: 8px; }
  .veredito { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: .03em; text-transform: uppercase; padding: 5px 14px; border-radius: 6px; color: #fff; }
  .veredito.ok { background: var(--ok); }
  .veredito.bad { background: var(--bad); }
  .cena { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--sky); }
  #cena { display: block; width: 100%; height: clamp(240px, 38vh, 380px); }

  .comandos { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .04em; text-transform: uppercase;
    border-radius: 10px; padding: 12px 20px; cursor: pointer; border: 1.5px solid var(--line); background: var(--panel);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  #largar { background: var(--paint); border-color: var(--paint); color: #161b22; min-width: 7.5em; }
  #freio {
    position: relative; overflow: hidden; flex: 1 1 220px; min-height: 64px;
    font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: .06em; text-transform: uppercase;
    border-radius: 12px; border: 2px solid var(--signal); background: var(--panel); color: var(--signal); cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #freio::before { content: ""; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--p, 0)); background: var(--signal); opacity: .9; }
  #freio span { position: relative; }
  @media (max-width: 600px) { #freio { order: 3; flex-basis: 100%; } }
  #freio.ativo { color: #fff; }
  #freio kbd { font-family: var(--font-mono); font-size: .8rem; font-weight: 500; opacity: .8; margin-left: 8px; letter-spacing: 0; }

  .painel { background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .rotulo { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grande { display: flex; align-items: baseline; gap: 8px; }
  #kmh { font-family: var(--font-mono); font-weight: 600; font-size: 3.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .grande span { font-family: var(--font-mono); color: var(--muted); }
  .faixa { font-family: var(--font-mono); font-size: 1.05rem; }
  .faixa b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .tele { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-family: var(--font-mono); font-size: .92rem; font-variant-numeric: tabular-nums; margin: 0; }
  .tele dt { color: var(--muted); }
  .tele dd { margin: 0; text-align: right; }
  .pedal { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .pedal i { display: block; height: 100%; width: 0; background: var(--signal); }
  #instante { margin: 0; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }

  .graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
  .graf { background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px 6px; min-width: 0; }
  .graf h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; }
  .graf h3 span { font-family: var(--font-mono); font-weight: 500; font-size: .85rem; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .graf canvas { display: block; width: 100%; height: 96px; touch-action: pan-y; cursor: crosshair; }
  .graf p { margin: 4px 0 0; font-family: var(--font-mono); font-size: .82rem; color: var(--muted); min-height: 1.3em; }
  .graf p b { color: var(--ink); font-weight: 600; }

  .eq { border-top: 3px solid var(--ink); padding-top: 8px; }
  .eq h4 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .eq p { margin: 0; font-family: var(--font-mono); font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="marca">
      <div class="semaforo" aria-hidden="true"><i></i><i></i><i></i></div>
      <div>
        <h1>Parada Perfeita</h1>
        <p class="sub">Freie o carro e pare exatamente na faixa.</p>
      </div>
    </div>
    <nav class="fases" id="fases" aria-label="Fases"></nav>
  </header>

  <main class="grade">
    <section class="pista">
      <div class="topo">
        <p class="missao" id="missao"></p>
        <p class="veredito" id="veredito" hidden></p>
      </div>
      <div class="cena"><canvas id="cena" aria-label="Pista vista de lado, com o carro e a faixa de parada"></canvas></div>
      <div class="comandos">
        <button type="button" class="btn" id="largar">Largar</button>
        <button type="button" id="freio" aria-label="Freio: segure para frear"><span>Freio<kbd>espaço</kbd></span></button>
        <button type="button" class="btn" id="reiniciar">Reiniciar</button>
      </div>
    </section>

    <aside class="painel" aria-label="Telemetria">
      <div>
        <p class="rotulo">Velocidade</p>
        <div class="grande"><b id="kmh">0</b><span>km/h</span></div>
      </div>
      <p class="faixa">Faixa a <b id="falta">—</b> m</p>
      <dl class="tele">
        <dt>t</dt><dd id="t-t">—</dd>
        <dt>s(t)</dt><dd id="t-s">—</dd>
        <dt>v = s′(t)</dt><dd id="t-v">—</dd>
        <dt>a = v′(t)</dt><dd id="t-a">—</dd>
        <dt>freio</dt><dd id="t-p">—</dd>
      </dl>
      <div class="pedal" aria-hidden="true"><i id="pedal"></i></div>
      <p id="instante">ao vivo</p>
    </aside>
  </main>

  <section class="graficos" id="graficos" aria-label="Gráficos no tempo">
    <div class="graf"><h3>Posição <span>s(t) · m</span></h3><canvas id="g-s"></canvas><p id="l-s"></p></div>
    <div class="graf"><h3>Velocidade <span>v(t) = s′(t) · m/s</span></h3><canvas id="g-v"></canvas><p id="l-v"></p></div>
    <div class="graf"><h3>Aceleração <span>a(t) = v′(t) · m/s²</span></h3><canvas id="g-a"></canvas><p id="l-a"></p></div>
  </section>

</div>

<script>
/* ================= CÁLCULO ================= */
const G = 9.8;          // gravidade (m/s²)
const FREIO_MAX = 8;    // desaceleração máxima do freio no seco (m/s²)
const C_AR = 0.003;     // resistência do ar: cresce com v²
const ROLAGEM = 0.1;    // atrito de rolagem (m/s²)
const PEDAL_SOBE = 2.5; // quanto o pedal afunda por segundo segurando
const PEDAL_DESCE = 5;  // quanto o pedal volta por segundo soltando
const SUB = 2, DT = 1 / (60 * SUB);   // 2 passos por quadro de 1/60 s

// derivada central: f'(x) ≈ [f(x + h) − f(x − h)] / 2h
function derivada(f, x, h = 1e-3) { return (f(x + h) - f(x - h)) / (2 * h); }

// derivada no tempo a partir de dois instantes: (atual − anterior) / Δt
function derivadaNoTempo(atual, anterior, dt) { return (atual - anterior) / dt; }

// aceleração do carro: freio + ar + rolagem + componente da gravidade na ladeira
function aceleracao(s, v, p, fase) {
  const freio = FREIO_MAX * fase.mu * p;          // depende do pedal p(t)
  const ar = C_AR * v * v;                        // depende da velocidade
  const inclinacao = derivada(fase.h, s);         // h'(s): inclinação da pista
  const rampa = -G * inclinacao / Math.sqrt(1 + inclinacao * inclinacao);  // depende da posição
  return -freio - ar - ROLAGEM + rampa;
}

/* ================= FASES ================= */
const FASES = [
  { nome: "Asfalto seco", v0: 12, D: 50, mu: 1, h: s => 0,
    dica: "Freio forte, pista boa." },
  { nome: "Pista molhada", v0: 14, D: 60, mu: 0.5, h: s => 0,
    dica: "O freio rende metade. Comece antes." },
  { nome: "Ladeira", v0: 14, D: 75, mu: 1, h: s => (s <= 0 || s >= 120) ? 0 : 4 * Math.cos(Math.PI * s / 60) - 4,
    dica: "Na descida a gravidade empurra o carro." }
];
const kmh = v => Math.round(v * 3.6);

/* ================= ESTADO ================= */
let fase = FASES[0], indiceFase = 0;
let est = null, segurando = false, inspecao = null, resultado = null;
const $ = id => document.getElementById(id);
const fmt = (v, c = 2) => {
  if (v == null || !isFinite(v)) return "—";
  if (Math.abs(v) < 0.5 * Math.pow(10, -c)) v = 0;
  return v.toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
};

function novoEstado() {
  const a0 = aceleracao(0, fase.v0, 0, fase);
  return { t: 0, s: 0, v: fase.v0, a: a0, p: 0, rodando: false, fim: false,
           hist: [{ t: 0, s: 0, v: fase.v0, a: a0, p: 0, vD: fase.v0, aD: a0 }] };
}

/* ================= SIMULAÇÃO ================= */
function passo() {
  // pedal: afunda enquanto segura, volta quando solta
  est.p = Math.min(1, Math.max(0, est.p + (segurando ? PEDAL_SOBE : -PEDAL_DESCE) * DT));
  est.a = aceleracao(est.s, est.v, est.p, fase);   // a(t)
  est.v = est.v + est.a * DT;                       // v(t + Δt) = v(t) + a·Δt
  if (est.v <= 0) { est.v = 0; est.fim = true; }
  est.s = est.s + est.v * DT;                       // s(t + Δt) = s(t) + v·Δt
  est.t += DT;
}

function quadro() {
  if (est.rodando) {
    for (let k = 0; k < SUB && !est.fim; k++) passo();
    const ant = est.hist[est.hist.length - 1];
    const vD = derivadaNoTempo(est.s, ant.s, est.t - ant.t);    // v ≈ Δs/Δt
    const aD = derivadaNoTempo(vD, ant.vD, est.t - ant.t);      // a ≈ Δv/Δt
    est.hist.push({ t: est.t, s: est.s, v: est.v, a: est.a, p: est.p, vD, aD });
    if (est.fim) terminar(false);
    else if (est.s > fase.D + 12) terminar(true);
  }
  desenhar();
  requestAnimationFrame(quadro);
}

function terminar(fugiu) {
  est.rodando = false; est.fim = true;
  const erro = est.s - fase.D;
  if (fugiu) resultado = { ok: false, txt: "Avançou o sinal" };
  else {
    const e = Math.abs(erro);
    const estrelas = e <= 0.25 ? 3 : e <= 1 ? 2 : e <= 2.5 ? 1 : 0;
    const onde = erro > 0 ? `${fmt(e)} m depois da faixa` : `${fmt(e)} m antes da faixa`;
    resultado = estrelas
      ? { ok: true, txt: `${"★".repeat(estrelas)}${"☆".repeat(3 - estrelas)}  ${onde}` }
      : { ok: false, txt: `Errou: ${onde}` };
  }
  resultado.erro = erro;
  mostrarVeredito(); atualizarBotoes();
}

function mostrarVeredito() {
  const v = $("veredito");
  v.hidden = !resultado;
  if (resultado) { v.textContent = resultado.txt; v.className = "veredito " + (resultado.ok ? "ok" : "bad"); }
}

/* ================= DESENHO ================= */
const css = getComputedStyle(document.documentElement);
const cor = n => css.getPropertyValue(n).trim();
function prep(cv) {
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function ret(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function desenharCena() {
  const { ctx, w, h } = prep($("cena"));
  const S0 = -6, S1 = fase.D + 12;
  const k = (w - 20) / (S1 - S0);                     // pixels por metro
  let hMin = 0, hMax = 0;
  for (let s = S0; s <= S1; s += 0.5) { const y = fase.h(s); hMin = Math.min(hMin, y); hMax = Math.max(hMax, y); }
  const base = Math.min(h * 0.74 + hMin * k * 0.5, h - 46 + hMin * k);
  const X = s => 10 + (s - S0) * k, Y = s => base - fase.h(s) * k;
  const mono = cor("--font-mono"), disp = cor("--font-display");

  ctx.fillStyle = cor("--sky"); ctx.fillRect(0, 0, w, h);
  // chão
  ctx.fillStyle = cor("--ground"); ctx.beginPath(); ctx.moveTo(0, h);
  for (let s = S0; s <= S1 + 1; s += 0.5) ctx.lineTo(X(s), Y(s) + 10);
  ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  // pista
  ctx.lineJoin = "round"; ctx.lineCap = "butt";
  ctx.strokeStyle = cor("--road"); ctx.lineWidth = 14; ctx.beginPath();
  for (let s = S0; s <= S1 + 1; s += 0.5) { const x = X(s), y = Y(s) + 5; s === S0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
  ctx.strokeStyle = cor("--paint"); ctx.lineWidth = 2; ctx.setLineDash([10, 10]); ctx.beginPath();
  for (let s = S0; s <= S1 + 1; s += 0.5) { const x = X(s), y = Y(s) + 5; s === S0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke(); ctx.setLineDash([]);
  // marcas de distância
  ctx.fillStyle = cor("--muted"); ctx.font = `11px ${mono}`; ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let s = 0; s <= S1; s += 10) {
    if (Math.abs(s - fase.D) < 4) continue;
    ctx.fillRect(X(s) - 0.5, Y(s) + 13, 1, 6);
    ctx.fillText(`${s} m`, X(s), Y(s) + 21);
  }
  // faixa de parada e semáforo
  const xf = X(fase.D), yf = Y(fase.D);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(xf - 2, yf - 2, 4, 14);
  ctx.fillStyle = cor("--ink"); ctx.font = `600 12px ${mono}`;
  ctx.fillText(`${fase.D} m`, xf, yf + 21);
  const xp = xf + 14;
  ctx.fillStyle = "#2a2f36"; ctx.fillRect(xp - 2, yf - 92, 4, 92);
  ret(ctx, xp - 11, yf - 140, 22, 54, 5); ctx.fill();
  const luzes = ["#ff3b45", "#4a3d1c", "#1d3b2a"];
  luzes.forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(xp, yf - 128 + i * 16, 6, 0, Math.PI * 2); ctx.fill(); });
  ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = "#ff3b45"; ctx.beginPath(); ctx.arc(xp, yf - 128, 11, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  // carro (a frente do carro é a posição s)
  const Lp = Math.max(4.2 * k, 84), L = Lp / k, sc = est.s, ang = Math.atan(derivada(fase.h, sc - L / 2));
  const cx = X(sc - L / 2), cy = Y(sc - L / 2) - 2;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-ang);
  const Hp = Lp * 0.24;
  ctx.fillStyle = "#1f5fd1"; ctx.strokeStyle = "#161b22"; ctx.lineWidth = 1.5;
  ret(ctx, -Lp / 2, -Hp - 4, Lp, Hp, 4); ctx.fill(); ctx.stroke();
  ret(ctx, -Lp * 0.22, -Hp * 1.75 - 4, Lp * 0.5, Hp * 0.8, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#cfe3ff"; ret(ctx, -Lp * 0.17, -Hp * 1.65 - 4, Lp * 0.4, Hp * 0.55, 2); ctx.fill();
  ctx.fillStyle = "#161b22";
  [-Lp * 0.3, Lp * 0.3].forEach(x => { ctx.beginPath(); ctx.arc(x, -4, Math.max(4, Hp * 0.36), 0, Math.PI * 2); ctx.fill(); });
  // luz de freio
  const luz = est.rodando ? est.p : 0;
  ctx.fillStyle = luz > 0.05 ? "#ff2a35" : "#7a2a2e";
  ctx.fillRect(-Lp / 2 - 1, -Hp + 1, 4, Hp * 0.35);
  if (luz > 0.05) { ctx.globalAlpha = 0.25 + 0.5 * luz; ctx.beginPath(); ctx.arc(-Lp / 2, -Hp + 3, 10, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  // farol
  ctx.fillStyle = "#ffe48a"; ctx.fillRect(Lp / 2 - 3, -Hp + 1, 3, Hp * 0.3);
  ctx.restore();

  // velocidade acima do carro
  ctx.fillStyle = cor("--ink"); ctx.font = `700 15px ${disp}`; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillText(`${kmh(est.v)} km/h`, cx, cy - Hp * 2 - 10);

  // erro final
  if (resultado && !(resultado.txt === "Avançou o sinal")) {
    const xa = X(est.s), y0 = yf + 44;
    ctx.strokeStyle = resultado.ok ? cor("--ok") : cor("--bad"); ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(xa, y0); ctx.lineTo(xf, y0); ctx.stroke();
    ctx.font = `600 13px ${mono}`; ctx.textBaseline = "top";
    ctx.fillText(`${resultado.erro > 0 ? "+" : "−"}${fmt(Math.abs(resultado.erro))} m`, (xa + xf) / 2, y0 + 5);
  }
}

function grafico(id, chave, opt) {
  const { ctx, w, h } = prep($(id));
  ctx.clearRect(0, 0, w, h);
  const dados = est.hist;
  const tMax = Math.max(4, dados[dados.length - 1].t * 1.05);
  const vals = dados.map(p => p[chave]).concat(opt.ref != null ? [opt.ref] : [], 0);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const P = { l: 36, r: 10, t: 8, b: 20 };
  const X = t => P.l + t / tMax * (w - P.l - P.r);
  const Y = v => h - P.b - (v - lo) / (hi - lo) * (h - P.t - P.b);
  const mono = cor("--font-mono");

  // grade
  ctx.strokeStyle = cor("--line"); ctx.lineWidth = 1; ctx.font = `11px ${mono}`; ctx.fillStyle = cor("--muted");
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const passoT = tMax > 8 ? 2 : 1;
  for (let t = 0; t <= tMax; t += passoT) { ctx.beginPath(); ctx.moveTo(X(t), P.t); ctx.lineTo(X(t), h - P.b); ctx.stroke(); ctx.fillText(`${t}s`, X(t), h - P.b + 4); }
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  [lo + pad, hi - pad].forEach(v => ctx.fillText(fmt(v, 0), P.l - 5, Y(v)));
  if (lo < 0 && hi > 0) { ctx.strokeStyle = cor("--muted"); ctx.beginPath(); ctx.moveTo(P.l, Y(0)); ctx.lineTo(w - P.r, Y(0)); ctx.stroke(); }
  if (opt.ref != null) {
    ctx.strokeStyle = cor("--signal"); ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(P.l, Y(opt.ref)); ctx.lineTo(w - P.r, Y(opt.ref)); ctx.stroke(); ctx.setLineDash([]);
  }
  // curva
  ctx.fillStyle = cor("--accent"); ctx.globalAlpha = 0.1; ctx.beginPath(); ctx.moveTo(X(0), Y(Math.max(lo, Math.min(0, hi))));
  dados.forEach(p => ctx.lineTo(X(p.t), Y(p[chave]))); ctx.lineTo(X(dados[dados.length - 1].t), Y(Math.max(lo, Math.min(0, hi)))); ctx.fill();
  ctx.globalAlpha = 1; ctx.strokeStyle = cor("--accent"); ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.beginPath();
  dados.forEach((p, i) => i ? ctx.lineTo(X(p.t), Y(p[chave])) : ctx.moveTo(X(p.t), Y(p[chave]))); ctx.stroke();

  // instante (ao vivo ou inspecionado)
  const p = dados[indiceAtual()];
  if (inspecao != null) { ctx.strokeStyle = cor("--muted"); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(p.t), P.t); ctx.lineTo(X(p.t), h - P.b); ctx.stroke(); ctx.setLineDash([]); }
  // reta tangente: a inclinação é a derivada naquele instante
  if (opt.inclinacao) {
    const m = p[opt.inclinacao], sx = (w - P.l - P.r) / tMax, sy = (h - P.t - P.b) / (hi - lo);
    const dx = sx, dy = -m * sy, n = Math.hypot(dx, dy), L = 46;
    ctx.save(); ctx.beginPath(); ctx.rect(P.l, P.t, w - P.l - P.r, h - P.t - P.b); ctx.clip();
    ctx.strokeStyle = cor("--signal"); ctx.lineWidth = 2.5; ctx.beginPath();
    ctx.moveTo(X(p.t) - dx / n * L, Y(p[chave]) - dy / n * L); ctx.lineTo(X(p.t) + dx / n * L, Y(p[chave]) + dy / n * L); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = cor("--paint"); ctx.strokeStyle = "#161b22"; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(X(p.t), Y(p[chave]), 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  return { P, tMax, w };
}

function indiceAtual() {
  const d = est.hist;
  if (inspecao == null) return d.length - 1;
  let i = 0; while (i < d.length - 1 && d[i + 1].t <= inspecao) i++;
  return i;
}

let geo = null;
function desenhar() {
  desenharCena();
  geo = grafico("g-s", "s", { ref: fase.D, inclinacao: "vD" });
  grafico("g-v", "v", { inclinacao: "aD" });
  grafico("g-a", "a", {});
  const p = est.hist[indiceAtual()];
  $("l-s").innerHTML = `s = <b>${fmt(p.s)} m</b> · inclinação da tangente = v = <b>${fmt(p.vD)}</b>`;
  $("l-v").innerHTML = `v = <b>${fmt(p.v)} m/s</b> · inclinação da tangente = a = <b>${fmt(p.aD)}</b>`;
  $("l-a").innerHTML = `a = <b>${fmt(p.a)} m/s²</b> · freio em <b>${Math.round(p.p * 100)}%</b>`;
  $("kmh").textContent = kmh(p.v);
  $("falta").textContent = fmt(fase.D - p.s, 1);
  $("t-t").textContent = fmt(p.t) + " s";
  $("t-s").textContent = fmt(p.s) + " m";
  $("t-v").textContent = fmt(p.vD) + " m/s";
  $("t-a").textContent = fmt(p.aD) + " m/s²";
  $("t-p").textContent = Math.round(p.p * 100) + "%";
  $("pedal").style.width = (p.p * 100) + "%";
  $("instante").textContent = inspecao == null ? "ao vivo" : `inspecionando t = ${fmt(p.t)} s`;
  const pedalBotao = est.rodando ? est.p : 0;
  $("freio").style.setProperty("--p", pedalBotao);
  $("freio").classList.toggle("ativo", pedalBotao > 0.5);
}

/* ================= INTERFACE ================= */
function escolherFase(i) {
  indiceFase = i; fase = FASES[i];
  $("fases").querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
  $("missao").innerHTML = `<strong>Pare na faixa a ${fase.D} m</strong>${fase.dica}`;
  reiniciar();
}
function reiniciar() { est = novoEstado(); resultado = null; inspecao = null; mostrarVeredito(); atualizarBotoes(); }
function largar() {
  if (est.rodando) return;
  if (est.fim) reiniciar();
  est.rodando = true; inspecao = null; atualizarBotoes();
}
function atualizarBotoes() {
  $("largar").disabled = est.rodando;
  $("largar").textContent = est.fim ? "De novo" : "Largar";
}

$("fases").innerHTML = FASES.map((f, i) =>
  `<button type="button" id="fase-${i + 1}" aria-pressed="false"><b>${i + 1} · ${f.nome}</b><small>${kmh(f.v0)} km/h · faixa a ${f.D} m</small></button>`).join("");
$("fases").querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => escolherFase(i)));
$("largar").addEventListener("click", largar);
$("reiniciar").addEventListener("click", reiniciar);

const freio = $("freio");
freio.addEventListener("pointerdown", e => { e.preventDefault(); segurando = true; try { freio.setPointerCapture(e.pointerId); } catch (_) {} });
["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => freio.addEventListener(ev, () => { segurando = false; }));
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowDown") { e.preventDefault(); segurando = true; }
  if (e.code === "Enter" && document.activeElement?.tagName !== "BUTTON") largar();
});
document.addEventListener("keyup", e => { if (e.code === "Space" || e.code === "ArrowDown") { e.preventDefault(); segurando = false; } });
window.addEventListener("blur", () => { segurando = false; });

// passar o mouse (ou o dedo) nos gráficos mostra qualquer instante da freada
document.querySelectorAll(".graf canvas").forEach(cv => {
  cv.addEventListener("pointermove", e => {
    if (est.rodando || !geo || est.hist.length < 2) return;
    const r = cv.getBoundingClientRect();
    const t = (e.clientX - r.left - geo.P.l) / (r.width - geo.P.l - geo.P.r) * geo.tMax;
    inspecao = Math.max(0, Math.min(t, est.hist[est.hist.length - 1].t));
  });
  cv.addEventListener("pointerleave", () => { inspecao = null; });
});

function iniciar(dados) {
  escolherFase(dados && Number.isInteger(dados.fase) ? dados.fase : 0);
  requestAnimationFrame(quadro);
}
window.claude?.hot?.snapshot?.(() => ({ fase: indiceFase }));
window.claude?.hot?.ready ? window.claude.hot.ready(iniciar) : iniciar(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
